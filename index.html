<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARE QR</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
}

.sticker {
    width: 300px;
    padding: 35px 20px;
    background: #000;
    text-align: center;
    border: 2px solid #C9A227;
    border-radius: 12px;
}

.logo {
    color: #C9A227;
    font-size: 50px;
    font-weight: bold;
    letter-spacing: 5px;
    margin-bottom: 30px;
}

.qr {
    width: 190px;
    height: 190px;
    background: white;
    padding: 10px;
}
</style>
</head>

<body>

<div class="sticker">

    <div class="logo">CARE</div>

    <img
        class="qr"
        src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Ftonihoueiss-ctrl.github.io%2Fcare-qr%2Fservice.html"
        alt="CARE Service QR Code"
    >

</div>

</body>
</html>
